# Character v2 pose manifest: the single list of poses. build_character.py reads this.
#
#   sheet   key from `sheets` below
#   cell    [row, col], 1-based, in that sheet's grid
#   mouth   [x, y] in sheet pixels, measured on zoomed crops. For poses that can't talk it's still the face point used to
#           place and scale the figure.
#   talks   lip-sync mouths are drawn on this pose
#   head    split = own head layer (tilt/nod/turn) · fixed = upper body moves as one (hand on face)
#   stance  stand = mouth aligned to the shared mouth point · walk/sit/crouch = feet on the
#           baseline, scaled by head size, not mouth-aligned
# Optional overrides after a review board: neck [x, y] (canvas px), lenses [[x, y, r], [x, y, r]]
# (canvas px).

# bg_tol: background tolerance for the cut-out (default 14, what the v1 sheets need)
sheets:
  s1: {file: sheets/sheet1_full.jpg, grid: [3, 2]}
  s2: {file: sheets/sheet2_full.jpg, grid: [3, 2]}
  s3: {file: sheets/sheet3_mixed_6x4.webp, grid: [6, 4], bg_tol: 10}
  s4: {file: sheets/sheet4_full_8x3.webp, grid: [8, 3], bg_tol: 5}

poses:
  # ── kept from v1 ──
  idle:          {sheet: s1, cell: [1, 1], mouth: [342, 90],  talks: true,  head: split, stance: stand}
  talk:          {sheet: s1, cell: [1, 2], mouth: [764, 90], talks: true,  head: split, stance: stand}
  point_up:      {sheet: s1, cell: [1, 3], mouth: [1146, 89],  talks: true,  head: split, stance: stand}
  hold_paper:    {sheet: s1, cell: [2, 1], mouth: [338, 596], talks: true,  head: split, stance: stand}
  point_down:    {sheet: s1, cell: [2, 2], mouth: [759, 593], talks: true,  head: split, stance: stand}
  wave:          {sheet: s1, cell: [2, 3], mouth: [1172, 596], talks: true,  head: split, stance: stand}
  mind_blown:    {sheet: s2, cell: [2, 2], mouth: [765, 589], talks: false, head: fixed, stance: stand}

  # ── replaced by sheet 4 art (same names) ──
  laptop:        {sheet: s4, cell: [1, 1], mouth: [100, 69],  talks: true,  head: split, stance: stand}
